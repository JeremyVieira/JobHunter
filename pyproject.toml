[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter"
version = "2.0.0"
description = "Collect, score and track job postings, and prepare honest, verified application documents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dynamic = ["dependencies"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business",
]

[project.scripts]
jobhunter = "jobhunter.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["jobhunter/requirements.txt"] }

[tool.setuptools.packages.find]
include = ["jobhunter*"]
namespaces = true

[tool.setuptools.package-data]
jobhunter = [
    "demo_data/*.txt",
    # templates only - never the private master_resume*.txt / summary_variants.json
    "resume/*.template.txt",
    "resume/*.template.json",
    ".streamlit/*.toml",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::urllib3.exceptions.InsecureRequestWarning",
    "ignore:.*RequestsDependencyWarning.*:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["jobhunter"]
