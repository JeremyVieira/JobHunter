name: Security

on:
  schedule:
    - cron: "0 12 * * 1" # weekly, Monday 12:00 UTC
  pull_request:
    paths:
      - jobhunter/requirements.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r jobhunter/requirements.txt --no-deps --disable-pip
