name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: jobhunter/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r jobhunter/requirements.txt pytest pytest-xdist ruff

      - name: Install coverage dependency
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pip install pytest-cov

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest tests -n auto -q

      - name: Tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pytest tests -q --cov=jobhunter --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Smoke-test the CLI
        run: |
          python -m jobhunter version
          python -m jobhunter demo --seed-only

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  package:
    name: Build and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and check it ships its data files
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          required = [
              "jobhunter/demo_data/demo_resume_en.txt",
              "jobhunter/resume/master_resume.template.txt",
              "jobhunter/resume/summary_variants.template.json",
              "jobhunter/.streamlit/config.toml",
          ]
          missing = [r for r in required if r not in names]
          assert not missing, f"missing from wheel: {missing}"
          private = [n for n in names if n.endswith(("master_resume.txt", "master_resume_fr.txt", "summary_variants.json", ".env"))]
          assert not private, f"private files leaked into wheel: {private}"
          print("wheel contents OK")
          PY
      - name: Install the wheel and run the command
        run: |
          python -m pip install --no-deps dist/*.whl
          jobhunter version
